name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "tools/build_report.txt"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build_full.log

      - name: Write build report
        run: |
          mkdir -p tools
          {
            echo "Build run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "Commit: ${{ github.sha }}"
            echo "Timestamp (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Gradle exit status: ${{ steps.build.outcome }}"
            echo "----- last 400 lines of build output -----"
            tail -n 400 /tmp/build_full.log
          } > tools/build_report.txt

      - name: Commit build report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/build_report.txt
          git diff --cached --quiet || git commit -m "Update build report [skip ci]"
          git push

      - name: Find APK
        id: findapk
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.findapk.outputs.apk_path }}
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Gradle build failed — see tools/build_report.txt (just committed) for the log."
          exit 1
