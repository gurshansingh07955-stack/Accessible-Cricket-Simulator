name: Apply patches

# Upload a patch file (patches/*.json) and this runs by itself: it applies the
# patch, commits the result to main, and starts the "Build APK" workflow (a push
# made with the built-in token does not start that workflow on its own).
# See tools/apply_patch.js for the patch format and the all-or-nothing rule.
# The result of every run, good or bad, is written to tools/patch_report.txt.
# Can also be started by hand from the Actions tab (it then retries whatever is
# still waiting in patches/).

on:
  push:
    branches: [main]
    paths:
      - "patches/*.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-patches
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply pending patches
        id: apply
        continue-on-error: true
        run: node tools/apply_patch.js

      - name: Commit the result
        id: commit
        env:
          MSG: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "${MSG:-Update patch report} [patch]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries."
          exit 1

      - name: Start the APK build
        if: steps.apply.outcome == 'success' && steps.apply.outputs.changed == 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main

      - name: Fail the run if a patch failed
        if: steps.apply.outcome == 'failure'
        run: |
          echo "A patch failed - nothing was changed. See tools/patch_report.txt for the reason."
          exit 1
